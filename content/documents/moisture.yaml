slug: moisture
navLabel: Moisture
engine: moisture

sections:
  - type: hero
    id: hero
    # Not engine-specific product content — a shared marketing-page label, not sourced from
    # Product Truth.
    eyebrow: "Product truth · stakeholder overview"
    # Source: MOISTURE-PRODUCT-TRUTH.md front matter (title) / doc "Last updated" line.
    last_updated: "2026-08-22"
    title: "Moisture"
    # Source: MOISTURE-PRODUCT-TRUTH.md §0 "One job." (verbatim, 1:1 — no Public: line needed).
    job_statement: >-
      Help growers keep plants in a healthy moisture range, with or without a sensor, by
      replacing watering guesswork with plant-, soil-, and environment-aware guidance before
      visible stress or overwatering damage.
    support_statement:
      # Source: §0 "Hero story." line (mechanical punctuation edit only).
      label: "Useful without a sensor, stronger with one"
      # Source: §0 hero blockquote (verbatim, 1:1).
      text: >-
        You do not need expensive hardware to get useful moisture guidance. ElysHub estimates
        plant moisture from what it knows; a sensor upgrades confidence and precision.
    # Source: §0 "Value pills (public)" list (verbatim).
    value_pills:
      - "A decision engine, not a sensor dashboard"
      - "Water conservation is an outcome, not the headline"
      - "Sensor-optional monitoring is an enabling capability"
    # Source: §1 "Context cards (public)" table (verbatim).
    context_cards:
      - id: audience
        label: "Who"
        text: >-
          Small-scale farmers and experienced growers who need better watering decisions than
          habit, surface-soil checks, or visible plant stress. Hoses, drip, greenhouse or
          sensors — hardware is not required.
      - id: action_unit
        label: "Action unit"
        text: >-
          The plot is the default watering decision — plants in a plot are normally managed
          together. A plant-level exception is only for a plant that materially needs different
          treatment.

